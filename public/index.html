<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f4f5">
  <meta name="description" content="在地图上规划骑行路线，或告诉 Agent 你想怎么骑。">
  <title>路书制作 · AI Cycler</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-icon" data-icon="bike" aria-hidden="true"></span><strong>AI Cycler</strong><span class="brand-divider"></span><span class="brand-section">路书制作</span></div>
      <span class="environment" id="environment"><span></span>正在连接</span>
    </header>
    <main>
      <div class="page-heading">
        <div><h1>路线编辑器</h1><p>在地图上选点，或告诉 AI 你想怎么骑。</p></div>
      </div>

      <div class="workspace">
        <nav class="card roadbooks" aria-labelledby="roadbook-heading">
          <div class="card-top">
            <h2 id="roadbook-heading">我的路书</h2>
            <button class="button secondary roadbook-new" type="button" id="new-roadbook" aria-label="新建路线" disabled><span data-icon="plus"></span>新建</button>
          </div>
          <p id="roadbook-empty" class="roadbook-empty">保存路线后，可在这里查看和管理。</p>
          <ul id="roadbook-list" class="roadbook-list"></ul>
          <button type="button" class="button secondary roadbook-draft" id="resume-draft" hidden>返回路线草稿</button>
          <div id="roadbook-details" class="roadbook-details" hidden>
            <dl class="metrics">
              <div><dt>里程</dt><dd id="distance">—</dd></div>
              <div><dt>预估爬升</dt><dd id="climb">—</dd></div>
              <div><dt>预计用时</dt><dd id="duration">—</dd></div>
            </dl>
            <dl class="roadbook-endpoints" id="roadbook-endpoints" hidden>
              <div><dt>起点</dt><dd id="roadbook-start"></dd></div>
              <div><dt>终点</dt><dd id="roadbook-end"></dd></div>
            </dl>
            <p class="roadbook-status" id="roadbook-status" hidden></p>
            <div class="roadbook-actions">
              <button type="button" id="edit-roadbook"><span data-icon="edit"></span>编辑</button>
              <button type="button" id="export" aria-label="导出 GPX"><span data-icon="download"></span>导出</button>
              <button type="button" id="delete-roadbook">删除</button>
            </div>
          </div>
        </nav>

        <section class="map-card" aria-label="路线地图">
          <div id="live-map" class="live-map" hidden></div>
          <canvas id="demo-map" aria-label="示例路网。也可使用地点搜索选择点位。"></canvas>
          <div class="map-tools">
            <form id="search-form" class="search-form" role="search">
              <span data-icon="search"></span><input id="search-input" name="地点" placeholder="搜索地名或地点" aria-label="搜索地点" autocomplete="off"><button type="submit">搜索</button>
            </form>
            <div id="search-results" class="search-results" hidden></div>
          </div>
          <div class="map-controls">
            <div class="zoom"><button type="button" id="zoom-in" aria-label="放大地图"><span data-icon="plus"></span></button><button type="button" id="zoom-out" aria-label="缩小地图"><span data-icon="minus"></span></button></div>
            <button type="button" id="fit-map" aria-label="查看整条路线"><span data-icon="locate"></span></button>
          </div>
          <div class="map-status"><span class="status-dot"></span><span id="map-message">正在加载地图</span></div>
          <span id="map-credit" class="map-credit">杭州示例路网</span>
        </section>

        <section class="card editor" aria-label="路线编辑区">
          <div class="editor-tabs" role="tablist" aria-label="编辑方式">
            <button id="ai-tab" type="button" role="tab" aria-selected="true" aria-controls="ai-panel"><span data-icon="spark"></span>AI 对话</button>
            <button id="manual-tab" type="button" role="tab" aria-selected="false" aria-controls="manual-panel" tabindex="-1"><span data-icon="edit"></span>手动编辑</button>
          </div>
          <section class="editor-panel route-card" id="manual-panel" role="tabpanel" aria-labelledby="manual-tab" hidden>
            <div class="card-top">
              <div><span class="card-label" id="draft-status">草稿</span><h2 id="route-title">我的骑行路书</h2></div>
              <button class="icon-button" id="rename" type="button" aria-label="重命名路线"><span data-icon="edit"></span></button>
            </div>
            <div class="points-header"><h3>路线点位</h3><label class="loop-toggle"><input type="checkbox" id="loop"><span data-icon="repeat"></span>返回起点</label></div>
            <p class="route-note" id="route-note" hidden role="status"></p>
            <ol id="points" class="points"></ol>
            <button class="button add-point" id="add-point" type="button"><span data-icon="plus"></span>添加点位</button>
            <button class="button dark save-roadbook" id="save-roadbook" type="button">保存路书</button>
          </section>

          <section class="editor-panel ai-card" id="ai-panel" role="tabpanel" aria-labelledby="ai-tab">
            <div class="prompts" id="prompts"><button type="button" data-prompt="从西湖文化广场出发，骑 40 公里左右，尽量少爬升，终点不限。">40 km · 终点不限</button><button type="button" data-prompt="从西湖文化广场出发，骑到湘湖，累计爬升不超过 300 米。">爬升 300 m 内</button><button type="button" data-prompt="从西湖文化广场出发，途经六和塔，骑到湘湖，中途需要补给。">中途找个补给点</button></div>
            <div id="agent-results" class="agent-results" role="log" aria-label="路线对话" aria-live="off" tabindex="0" hidden></div>
            <span id="agent-announcement" class="sr-only" role="status"></span>
            <div id="agent-target" class="agent-target" hidden></div>
            <form id="agent-form" class="agent-form"><label class="sr-only" for="agent-input">路线消息</label><textarea id="agent-input" rows="2" maxlength="600" placeholder="说说想从哪出发、骑多远"></textarea><button type="submit" aria-label="发送消息" id="plan-button"><span data-icon="send"></span></button></form>
          </section>
        </section>
      </div>
      <p class="footer-note" id="footer-note">示例路网用于体验编辑与导出流程。</p>
    </main>
  </div>

  <dialog id="dialog"><form method="dialog" class="dialog-body"><div class="dialog-heading"><h2 id="dialog-title"></h2><button type="submit" value="cancel" class="icon-button" aria-label="关闭"><span data-icon="close"></span></button></div><div id="dialog-content"></div><div class="dialog-actions"><button class="button secondary" value="cancel" type="submit">取消</button><button class="button dark" value="confirm" id="dialog-confirm" type="submit">确定</button></div></form></dialog>
  <div id="toast" role="status" class="toast" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
